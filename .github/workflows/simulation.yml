name: Simulation timing

on:
  pull_request:
    paths:
      - "crates/openstrike-core/**"
      - "crates/openstrike-companion/**"
      - "crates/openstrike-character/**"
      - "crates/openstrike-mods/**"
      - "mods/**"
      - "crates/openstrike-psp/**"
      - "game/sdk.ts"
      - "test/strike-sdk.test.ts"
      - "vendor/pocketjs"
      - "Cargo.lock"
      - ".github/workflows/simulation.yml"
  push:
    branches: [main]
    paths:
      - "crates/openstrike-core/**"
      - "crates/openstrike-companion/**"
      - "crates/openstrike-character/**"
      - "crates/openstrike-mods/**"
      - "mods/**"
      - "crates/openstrike-psp/**"
      - "game/sdk.ts"
      - "test/strike-sdk.test.ts"
      - "vendor/pocketjs"
      - "Cargo.lock"
      - ".github/workflows/simulation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p openstrike-core -p openstrike-character -p openstrike-mods -p openstrike-companion
      - run: cargo check --locked -p openstrike-core --no-default-features --features libm
      - run: bun test test/strike-sdk.test.ts
